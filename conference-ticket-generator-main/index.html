<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="styles.css">  
  <title>Frontend Mentor | Conference ticket generator</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
    
</head>
<body>

  <header class="icon_container">
      <img src="assets/images/logo-full.svg" class="lines" alt="">
  </header>
<main>
    <header>
        <h1>Your Journey to Coding Conf 2025 Starts Here!</h1>
        <h6>Secure your spot at next year's biggest coding conference.</h6>
    </header>
    <form action="">
        <label for="avatar" class="form_container"></label>
        <input type="file" id="avatar" class="avatar">
        <label for="name">Full Name</label>
        <input type="text" id="name">
        <label for="email">Email Address</label>
        <input type="text" id="email" placeholder="example@email.com">
        <label for="username">GitHub Username</label>
        <input type="text" id="username" placeholder="@yourusername">
        <button class="submit_button">Generate My Ticket</button>
    </form>
  </main>
