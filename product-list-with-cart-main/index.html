<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  </head>
  <body>
    <div id="app">
      <main>
        <section class="desserts">
          <h1 class="text-2xl">Desserts</h1>
          <div class="cards" v-for="(card, index) in data" :key="card.index">
            <div class="card">
              <div class="card_img_container">
                <img :src="card.image.mobile" alt="waffles image">
              </div>
              <div class="add_to_cart">
                <img src="assets/images/icon-add-to-cart.svg" alt="add to cart icon">
                <p class="text-lg">Add to Cart</p>
              </div>
              <div class="card_label">
                <p class="text-lg">{{ card.name}}</p>
                <p class="text-xl">{{ card.category }}</p>
                <p class="text-xl">${{card.price.toFixed(2)}}</p>
              </div>
            </div>
          </div>
        </section>


        <section class="cart"></section>
      </main>


    </div>
  </body>
  <script src="./app.js">
  </script>
</html>
